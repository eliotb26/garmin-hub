[project]
name = "garmin-hub"
version = "0.1.0"
description = "Pull your Garmin Connect data into SQLite, flag wrist-sensor errors, and query it from Claude over MCP"
readme = "README.md"
authors = [
    { name = "Eliot Brown", email = "eliotb26@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "curl-cffi>=0.16.3",
    "garminconnect>=0.3",
    "mcp>=2",
]

[project.scripts]
garmin-hub = "garmin_hub:main"

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
